[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dockerfile-hardening-lint"
version = "0.1.0"
description = "Static Dockerfile auditor for container hardening: no daemon, no build, no dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "duke5am" }]
keywords = [
  "docker", "dockerfile", "container", "linter", "security", "hardening",
  "static-analysis", "ci",
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
]
# Standard library only, on purpose: the tool runs where no container runtime
# is installed, which is the whole point.
dependencies = []

[project.scripts]
dockerfile-hardening-lint = "dockerfile_audit.cli:main"

[project.urls]
Homepage = "https://github.com/duke5am/dockerfile-hardening-lint"
Issues = "https://github.com/duke5am/dockerfile-hardening-lint/issues"

[tool.setuptools]
packages = ["dockerfile_audit"]
include-package-data = true
